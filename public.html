<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gap Finder — Анализ каналов</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        h1 { font-size: 32px; margin-bottom: 10px; background: linear-gradient(90deg, #ff8a00, #e52e71); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #aaa; margin-bottom: 30px; text-align: center; }
        .tabs { display: flex; gap: 10px; margin-bottom: 30px; background: #1e1e1e; padding: 5px; border-radius: 10px; border: 1px solid #333; }
        .tab-btn { padding: 10px 20px; border: none; background: transparent; color: #888; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.2s; }
        .tab-btn.active { background: #333; color: white; }
        
        .search-box { display: flex; gap: 10px; width: 100%; max-width: 600px; margin-bottom: 30px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; font-size: 16px; outline: none; }
        input:focus { border-color: #e52e71; }
        button.action-btn { padding: 15px 30px; border-radius: 8px; border: none; background: linear-gradient(90deg, #ff8a00, #e52e71); color: white; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #result, #top-result { width: 100%; max-width: 1000px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #333; }
        
        .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .lang-col { background: #2a2a2a; border-radius: 8px; padding: 15px; }
        .lang-title { font-size: 16px; font-weight: bold; color: #ff8a00; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .channel-item { font-size: 13px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #444; }
        .channel-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .channel-name { font-weight: bold; color: #fff; text-decoration: none; display: block; margin-bottom: 2px;}
        .channel-name:hover { color: #e52e71; }
        .channel-subs { color: #888; }
        
        .top-list { list-style: none; padding: 0; margin: 0; }
        .top-list li { padding: 16px 0; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .top-list li:last-child { border-bottom: none; }
        .top-info { display: flex; align-items: center; gap: 15px; }
        .top-rank { color: #e52e71; font-weight: bold; font-size: 18px; }
        .top-title { color: white; text-decoration: none; font-weight: bold; font-size: 16px; display: block; margin-bottom: 4px; }
        .top-title:hover { color: #ff8a00; }
        .top-meta { color: #888; font-size: 12px; }
        
        .top-stats { text-align: right; }
        .top-subs { color: #ff8a00; font-weight: bold; font-size: 16px; }
        .top-views { color: #888; font-size: 12px; }
        
        .btn-details { margin-top: 8px; padding: 6px 12px; background: #333; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 12px; transition: background 0.2s; }
        .btn-details:hover { background: #e52e71; border-color: #e52e71; }
    </style>
</head>
<body>

    <h1>Gap Finder</h1>
    
    <div class="tabs">
        <button id="tab1" class="tab-btn active">Анализ канала</button>
        <button id="tab2" class="tab-btn">Тренды</button>
    </div>

    <!-- Секция 1 -->
    <div id="analyze-section" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
        <p class="subtitle">Найдите конкурентов в разных языках на основе вашего канала</p>
        <div class="search-box">
            <input type="text" id="channelUrl" placeholder="Ссылка на канал (например, https://youtube.com/@MrBeast)" value="https://youtube.com/@ManhwaRecount">
            <button id="analyzeBtn" class="action-btn">Анализ</button>
        </div>
        <div id="result"></div>
    </div>

    <!-- Секция 2 -->
    <div id="top-section" style="display: none; width: 100%; max-width: 1000px;">
        <p class="subtitle">Самые просматриваемые видео за последнюю неделю в разных языковых сегментах</p>
        <div style="text-align: center; margin-bottom: 20px;">
            <button id="topBtn" class="action-btn">Показать Тренды</button>
        </div>
        <div id="top-result"></div>
    </div>

    <script>
        const tab1 = document.getElementById("tab1");
        const tab2 = document.getElementById("tab2");
        const analyzeSection = document.getElementById("analyze-section");
        const topSection = document.getElementById("top-section");

        function switchTab(tab) {
            if (tab === 'analyze') {
                analyzeSection.style.display = "flex";
                topSection.style.display = "none";
                tab1.classList.add("active");
                tab2.classList.remove("active");
            } else {
                analyzeSection.style.display = "none";
                topSection.style.display = "block";
                tab1.classList.remove("active");
                tab2.classList.add("active");
            }
        }

        tab1.addEventListener("click", () => switchTab('analyze'));
        tab2.addEventListener("click", () => switchTab('top'));

        // --- РАЗДЕЛ 1 ---
        const analyzeBtn = document.getElementById("analyzeBtn");
        const channelUrlInput = document.getElementById("channelUrl");
        const resultDiv = document.getElementById("result");

        async function analyzeChannel() {
            const url = channelUrlInput.value.trim();
            if (!url) return;
            analyzeBtn.disabled = true;
            analyzeBtn.textContent = "Ищем...";
            resultDiv.innerHTML = "<p style='color: #888;'>Анализируем канал и ищем конкурентов в 8 языках...</p>";
            try {
                const response = await fetch(`/api/analyze-channel?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                renderAnalyzeResult(data);
            } catch (err) {
                resultDiv.innerHTML = `<p style="color: red;">Ошибка: ${err.message}</p>`;
            } finally {
                analyzeBtn.disabled = false;
                analyzeBtn.textContent = "Анализ";
            }
        }

        function renderAnalyzeResult(data) {
            let html = `<div class="card"><h2>Канал: ${data.channelName}</h2><p style="color: #888;">Ниша: "${data.niche}"</p><div class="lang-grid">`;
            for (const [lang, channels] of Object.entries(data.topChannelsByLang)) {
                html += `<div class="lang-col"><div class="lang-title">${lang}</div>`;
                if (channels.length === 0) {
                    html += `<div style="color: #666; font-size: 13px;">Нет активных каналов</div>`;
                } else {
                    channels.forEach(ch => {
                        html += `<div class="channel-item"><a href="${ch.url}" target="_blank" class="channel-name">${ch.title}</a><span class="channel-subs">${ch.subscribers.toLocaleString()} подписчиков</span></div>`;
                    });
                }
                html += `</div>`;
            }
            html += `</div></div>`;
            resultDiv.innerHTML = html;
        }

        analyzeBtn.addEventListener("click", analyzeChannel);
        channelUrlInput.addEventListener("keypress", (e) => { if (e.key === "Enter") analyzeChannel(); });

        // --- РАЗДЕЛ 2 ---
        const topBtn = document.getElementById("topBtn");
        const topResultDiv = document.getElementById("top-result");

        topBtn.addEventListener("click", async () => {
            topBtn.disabled = true;
            topBtn.textContent = "Ищем...";
            topResultDiv.innerHTML = "<p style='color: #888;'>Собираем видео за последнюю неделю по 8 языкам...</p>";
            try {
                const response = await fetch(`/api/top-new-channels`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                
                if (data.videos.length === 0) {
                    topResultDiv.innerHTML = "<p style='color: #888;'>Видео не найдены. Попробуйте позже.</p>";
                    return;
                }

                let html = `<div class="card"><ul class="top-list">`;
                data.videos.forEach((v, index) => {
                    html += `
                        <li>
                            <div class="top-info">
                                <span class="top-rank">#${index + 1}</span>
                                <div>
                                    <a href="${v.url}" target="_blank" class="top-title">${v.title}</a>
                                    <div class="top-meta">Канал: ${v.channelTitle} · Язык: ${v.lang}</div>
                                </div>
                            </div>
                            <div class="top-stats">
                                <div class="top-subs">${v.views.toLocaleString()} просмотров</div>
                                <button class="btn-details" onclick="goToDetails('${v.channelId}')">Анализ канала</button>
                            </div>
                        </li>
                    `;
                });
                html += `</ul></div>`;
                topResultDiv.innerHTML = html;

            } catch (err) {
                topResultDiv.innerHTML = `<p style="color:red;">Ошибка: ${err.message}</p>`;
            } finally {
                topBtn.disabled = false;
                topBtn.textContent = "Показать Тренды";
            }
        });

        // Функция перехода к анализу по ID канала
        window.goToDetails = function(channelId) {
            const channelUrl = `https://youtube.com/channel/${channelId}`;
            channelUrlInput.value = channelUrl;
            switchTab('analyze');
            analyzeChannel();
        };
    </script>
</body>
</html>
