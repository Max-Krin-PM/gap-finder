<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gap Finder — Найди свободную нишу</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 40px;
        }
        input {
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #222;
            color: white;
            font-size: 16px;
            outline: none;
        }
        input:focus { border-color: #e52e71; }
        button {
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #ff8a00, #e52e71);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #result {
            width: 100%;
            max-width: 800px;
        }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .metrics {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .metric {
            background: #2a2a2a;
            padding: 15px 25px;
            border-radius: 8px;
            flex: 1;
            text-align: center;
        }
        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #ff8a00;
        }
        .metric-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th { color: #888; font-size: 12px; text-transform: uppercase; }
        .tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            background: #e52e71;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Gap Finder</h1>
    <p class="subtitle">Узнай, какие новые каналы взлетают в твоей нише</p>

    <div class="search-box">
        <input type="text" id="query" placeholder="Например: AI automation tutorials" value="Cursor AI coding">
        <button id="searchBtn">Анализ</button>
    </div>

    <div id="result"></div>

    <script>
        const searchBtn = document.getElementById("searchBtn");
        const queryInput = document.getElementById("query");
        const resultDiv = document.getElementById("result");

        async function search() {
            const q = queryInput.value.trim();
            if (!q) return;

            searchBtn.disabled = true;
            searchBtn.textContent = "Анализ...";
            resultDiv.innerHTML = "<p style='color: #888;'>Собираем данные с YouTube...</p>";

            try {
                const response = await fetch(`/api/analyze?q=${encodeURIComponent(q)}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);

                renderResult(data);
            } catch (err) {
                resultDiv.innerHTML = `<p style="color: red;">Ошибка: ${err.message}</p>`;
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = "Анализ";
            }
        }

        function renderResult(data) {
            let html = `
                <div class="card">
                    <h2 style="margin-top:0;">Ниша: ${data.query}</h2>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-value">${data.newChannelsCount}</div>
                            <div class="metric-label">Новых каналов (до 2 мес.)</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${data.index}</div>
                            <div class="metric-label">Индекс роста (ср. просмотры)</div>
                        </div>
                    </div>
            `;

            if (data.newChannels.length > 0) {
                html += `
                    <table>
                        <thead>
                            <tr>
                                <th>Канал</th>
                                <th>Дата создания</th>
                                <th>Просмотры</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                data.newChannels.forEach(ch => {
                    const date = new Date(ch.createdAt).toLocaleDateString();
                    html += `
                        <tr>
                            <td>${ch.title}</td>
                            <td>${date}</td>
                            <td><span class="tag">${ch.views}</span></td>
                        </tr>
                    `;
                });
                html += `</tbody></table>`;
            } else {
                html += `<p style="color: #888;">В этой нише нет новых каналов. Либо ниша занята, либо люди не создают под неё каналы.</p>`;
            }

            html += `</div>`;
            resultDiv.innerHTML = html;
        }

        searchBtn.addEventListener("click", search);
        queryInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") search();
        });
    </script>
</body>
</html>
